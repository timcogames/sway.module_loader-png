    let currentPaletteFile = 'PAL0.pal';

    let instance = create_loader_png_module({
      locateFile: function (path) {
        const baseURL = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf("/"));
        return baseURL + '/wwwroot/dist/' + path;
      }
    });

    instance.then((module) => {
      moduleInstance = module;
      console.log("WASM module loaded successfully");

      document.getElementById('png_save_image').addEventListener('click', handleSave);

      document.getElementById('png_file_upload').addEventListener('change', handleFileSelect);
      document.getElementById('palette-select').addEventListener('change', handlePaletteSelect);

      document.getElementById('png_add_col').addEventListener('click', handleAddColor);
      document.getElementById('png_rem_col').addEventListener('click', handleRemColor);
      document.getElementById('png_clr_pal').addEventListener('click', handleClearPalette);

      // Загружаем палитру по умолчанию при загрузке страницы
      loadPaletteFromFile('PAL0.pal');
    });

    async function loadPaletteFromFile(filename) {
      if (filename === 'custom') {
        // Не загружаем новую палитру, оставляем текущую
        updatePaletteButtons();
        return;
      }

      const loadingElement = document.getElementById('palette-loading');
      const errorElement = document.getElementById('palette-error');

      loadingElement.classList.remove('hidden');
      errorElement.classList.add('hidden');

      try {
        const response = await fetch(`./wwwroot/palettes/${filename}`);

        if (!response.ok) {
          throw new Error(`Failed to load palette file: ${response.status}`);
        }

        const text = await response.text();
        const palette = parsePALFile(text);

        if (palette.length > 0) {
          customPalette = palette;
          currentPaletteFile = filename;

          // Обновляем интерфейс
          selectedColorIndex = -1;
          updateCustomPaletteDisplay();
          updatePaletteButtons();

          // Обновляем палитру в плагине, если изображение загружено
          if (currentImageDescriptor) {
            updatePluginPalette();
          }

          console.log(`Palette loaded from ${filename}: ${palette.length} colors`);
        } else {
          throw new Error('Invalid palette file format');
        }
      } catch (error) {
        console.error('Error loading palette:', error);
        errorElement.textContent = `Ошибка загрузки палитры: ${error.message}`;
        errorElement.classList.remove('hidden');

        // Восстанавливаем предыдущий выбор
        document.getElementById('palette-select').value = currentPaletteFile;
      } finally {
        loadingElement.classList.add('hidden');
      }
    }

    function parsePALFile(content) {
      const lines = content.trim().split('\n');
      const palette = [];

      // Проверяем формат JASC-PAL
      if (lines.length < 4 || lines[0] !== 'JASC-PAL') {
        console.warn('Invalid JASC-PAL format');
        return palette;
      }

      // Пропускаем заголовок
      let lineIndex = 3; // Начинаем с строки с цветами

      for (let i = lineIndex; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line === '') continue;

        const rgb = line.split(/\s+/).map(Number);

        if (rgb.length >= 3) {
          const r = Math.min(255, Math.max(0, rgb[0]));
          const g = Math.min(255, Math.max(0, rgb[1]));
          const b = Math.min(255, Math.max(0, rgb[2]));

          // Конвертируем RGB в HEX
          const hexColor = rgbToHex(r, g, b);
          palette.push(hexColor);
        }
      }

      return palette;
    }

    function rgbToHex(r, g, b) {
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
    }

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : null;
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) {
        return;
      }

      if (file.type !== 'image/png') {
        alert('Please select a PNG file');
        return;
      }

      const reader = new FileReader();

      reader.onload = function (e) {
        if (!moduleInstance) {
          alert('WASM module not loaded yet');
          return;
        }

        try {
          // Создаем превью изображения.
          const preview = document.getElementById('pngImagePreview');
          const objectURL = URL.createObjectURL(file);
          preview.src = objectURL;
          preview.style.display = 'block';

          const arrayBuffer = e.target.result;
          pluginImageProvider = new moduleInstance.PNGPlugin();

          currentImageDescriptor = pluginImageProvider.loadFromArrayBuffer(arrayBuffer);

          displayImageInfo(currentImageDescriptor, file);

          // Активируем кнопки.
          document.getElementById('png_save_image').disabled = false;
          document.getElementById('png_add_col').disabled = false;

          // Применяем выбранную палитру при загрузке нового изображения.
          // applyPalette(currentPaletteType);

          selectedColorIndex = -1;
          updateCustomPaletteDisplay();
          updatePaletteButtons();
          updatePluginPalette();
        } catch (error) {
          console.error('Error analyzing PNG:', error);
          alert('Error analyzing PNG file: ' + error.message);
        }
      };

      reader.readAsArrayBuffer(file);
    }

    function handlePaletteSelect(event) {
      const paletteFile = event.target.value;
      loadPaletteFromFile(paletteFile);
    }

    function highlightSelectedColor() {
      // Убираем выделение со всех элементов.
      const colorItems = document.querySelectorAll('#png_custom_palette .color-item');
      colorItems.forEach(item => {
        item.classList.remove('selected');
      });

      // Добавляем выделение к выбранному элементу.
      if (selectedColorIndex >= 0) {
        const selectedItem = document.querySelector(`#png_custom_palette .color-item:nth-child(${selectedColorIndex + 1})`);
        if (selectedItem) {
          selectedItem.classList.add('selected');
        }
      }
    }

    function handleAddColor() {
      if (!currentImageDescriptor) {
        alert('No image loaded');
        return;
      }

      // Получаем случайный цвет из палитры изображения
      const colorAnalysis = currentImageDescriptor.colorAnalysis;
      if (colorAnalysis.uniqueColors.size() === 0) {
        alert('No colors available in the image');
        return;
      }

      // Выбираем случайный цвет из уникальных цветов изображения.
      const randomIndex = Math.floor(Math.random() * colorAnalysis.uniqueColors.size());
      const color = colorAnalysis.uniqueColors.get(randomIndex);

      // Пропускаем прозрачные цвета.
      if (color.getA() === 0) {
        handleAddColor(); // Рекурсивно пробуем еще раз.
        return;
      }

      const hexColor = rgbToHex(color.getR(), color.getG(), color.getB());

      // Добавляем цвет в пользовательскую палитру, если его там еще нет.
      if (!customPalette.includes(hexColor)) {
        customPalette.push(hexColor);
        updateCustomPaletteDisplay();
        updatePaletteButtons();
        updatePluginPalette();

        selectedColorIndex = customPalette.length - 1;
        highlightSelectedColor();

        // pluginImageProvider.setCustomPalette(currentImageDescriptor, customPalette);
        // document.getElementById('png_palette_count').textContent = pluginImageProvider.getImageDescriptor().paletteCount;
        // document.getElementById('png_colors_per_palette').textContent = pluginImageProvider.getImageDescriptor().colorsPerPalette;
      } else {
        alert('Цвет уже есть в палитре');
      }
    }

    function updatePaletteButtons() {
      const removeButton = document.getElementById('png_rem_col');
      const clearButton = document.getElementById('png_clr_pal');

      removeButton.disabled = selectedColorIndex === -1 || selectedColorIndex === 0;
      clearButton.disabled = customPalette.length <= 1; // Оставляем прозрачный цвет.
    }

    function updatePluginPalette() {
      if (pluginImageProvider && currentImageDescriptor) {
        pluginImageProvider.setCustomPalette(currentImageDescriptor, customPalette);

        // Обновляем информацию о палитре в интерфейсе.
        const updatedDescriptor = pluginImageProvider.getImageDescriptor();
        if (document.getElementById('png_palette_count')) {
          document.getElementById('png_palette_count').textContent = updatedDescriptor.paletteCount;
        }
        if (document.getElementById('png_colors_per_palette')) {
          document.getElementById('png_colors_per_palette').textContent = updatedDescriptor.colorsPerPalette;
        }
      }
    }

    function updateCustomPaletteDisplay() {
      const customPaletteContainer = document.getElementById('png_custom_palette');
      customPaletteContainer.innerHTML = '';

      customPalette.forEach((hexColor, index) => {
        const colorListItem = document.createElement('li');
        colorListItem.className = `color-item ${index === selectedColorIndex ? 'selected' : ''}`;
        colorListItem.innerHTML = `
          <div class="color-box">
            <div class="color" style="background-color: ${hexColor};"></div>
            <input class="name selectable" type="text" value="${hexColor}" 
                   data-index="${index}"
                   ${index === 0 ? 'readonly' : ''}>
          </div>
        `;

        // Добавляем обработчики событий
        const colorElement = colorListItem.querySelector('.color');
        const inputElement = colorListItem.querySelector('input');

        // Клик на цветовой элемент - выбор цвета
        colorElement.addEventListener('click', () => {
          selectedColorIndex = index;
          highlightSelectedColor();
          updatePaletteButtons();
        });

        // Клик на сам элемент списка тоже должен выделять цвет.
        colorListItem.addEventListener('click', (evt) => {
          if (evt.target === colorListItem || evt.target === colorElement) {
            selectedColorIndex = index;
            highlightSelectedColor();
            updatePaletteButtons();
          }
        });

        // Изменение значения в input
        inputElement.addEventListener('change', (e) => {
          handleColorInputChange(e.target, index);
        });

        // Enter для подтверждения изменения
        inputElement.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            e.target.blur();
          }
        });

        // Двойной клик для редактирования
        inputElement.addEventListener('dblclick', (e) => {
          if (index !== 0) { // Не разрешаем редактировать прозрачный цвет
            e.target.readOnly = false;
            e.target.select();
          }
        });

        customPaletteContainer.appendChild(colorListItem);
      });
    }

    function handleColorInputChange(inputElement, index) {
      if (index === 0) {
        return; // Не разрешаем изменять прозрачный цвет
      }

      const newColor = inputElement.value.trim();

      // Проверяем валидность HEX цвета.
      if (!isValidHexColor(newColor)) {
        alert('Неверный формат цвета. Используйте формат #RRGGBB');
        inputElement.value = customPalette[index]; // Восстанавливаем старое значение.
        return;
      }

      // Проверяем, нет ли такого цвета уже в палитре.
      if (customPalette.includes(newColor) && newColor !== customPalette[index]) {
        alert('Этот цвет уже есть в палитре');
        inputElement.value = customPalette[index]; // Восстанавливаем старое значение.
        return;
      }

      // Обновляем цвет в палитре.
      customPalette[index] = newColor;

      // Обновляем отображение цвета.
      const colorElement = inputElement.closest('.color-item').querySelector('.color');
      colorElement.style.backgroundColor = newColor;

      // Делаем input снова readonly.
      inputElement.readOnly = true;

      // Обновляем палитру в плагине.
      updatePluginPalette();
    }

    function handleRemColor() {
      if (selectedColorIndex === -1) {
        alert('Выберите цвет для удаления');
        return;
      }

      customPalette.splice(selectedColorIndex, 1);
      selectedColorIndex = -1;
      highlightSelectedColor();
      updateCustomPaletteDisplay();
      updatePaletteButtons();
      updatePluginPalette();
    }

    function handleClearPalette() {
      if (customPalette.length === 0) {
        return;
      }

      if (confirm('Очистить всю палитру?')) {
        customPalette = [];
        customPalette.push('#ff00ff'); //!< transparent color.

        selectedColorIndex = -1;
        highlightSelectedColor();
        updateCustomPaletteDisplay();
        updatePaletteButtons();
        updatePluginPalette();
      }
    }

    function handleSave() {
      if (!currentImageDescriptor || !moduleInstance) {
        alert('No image loaded');
        return;
      }

      try {
        // const indexedPNGData = pluginImageProvider.saveToIndexedArrayBuffer(currentImageDescriptor);
        const indexedPNGData = pluginImageProvider.saveToIndexedArrayBuffer(pluginImageProvider.getImageDescriptor());

        // Создаем Blob и скачиваем файл.
        const blob = new Blob([indexedPNGData], { type: 'image/png' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = 'indexed_image.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        URL.revokeObjectURL(url);

        alert('Indexed PNG saved successfully!');
      } catch (error) {
        console.error('Error saving indexed PNG:', error);
        alert('Error saving indexed PNG: ' + error.message);
      }
    }
